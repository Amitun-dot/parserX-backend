spring.application.name=parserx-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/parserx_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=parserx-super-secret-key-change-this-later-2026
jwt.expiration=86400000

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

# =========================================================

# NVIDIA Nemotron Ultra

# =========================================================

spring.ai.openai.api-key=${NVIDIA_API_KEY}
spring.ai.openai.base-url=https://integrate.api.nvidia.com/v1
spring.ai.openai.chat.model=nvidia/nemotron-3-ultra-550b-a55b


spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=3s
spring.ai.retry.on-client-errors=false
spring.ai.retry.exclude-on-http-codes=429


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
